[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dou"
version = "0.1.0"
description = "DOU data collection CLI"
authors = [{name = "DOU Team"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0",
    "rich",
    "fastapi",
    "selenium",
    "dotenv",
    "holidays>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
dou-links = "src.cli:links"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.domain.entity" = ["notallowed.json"]


[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"